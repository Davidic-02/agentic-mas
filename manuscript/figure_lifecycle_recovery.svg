<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="470" fill="#FDFEFF"/>
  <text x="50" y="48" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">EXECUTION LIFECYCLE WITH FAILURE HANDLING</text>
  <text x="50" y="72" font-size="12" fill="#7A8899" font-weight="normal">re-formation path after withdrawal or timeout</text>
  <rect x="56" y="132" width="190" height="84" rx="9" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="151" y="162" font-size="13.2" fill="#1B4F80" font-weight="bold" text-anchor="middle">discover</text>
  <text x="151" y="185" font-size="10.8" fill="#0F2740" font-weight="normal" text-anchor="middle">read live cards</text>
  <line x1="246" y1="174" x2="272" y2="174" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="272" y="132" width="190" height="84" rx="9" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="367" y="162" font-size="13.2" fill="#1B4F80" font-weight="bold" text-anchor="middle">form</text>
  <text x="367" y="185" font-size="10.8" fill="#0F2740" font-weight="normal" text-anchor="middle">derive ordered team</text>
  <line x1="462" y1="174" x2="488" y2="174" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="488" y="132" width="190" height="84" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="583" y="162" font-size="13.2" fill="#1B4F80" font-weight="bold" text-anchor="middle">execute</text>
  <text x="583" y="185" font-size="10.8" fill="#0F2740" font-weight="normal" text-anchor="middle">invoke next agent</text>
  <line x1="678" y1="174" x2="704" y2="174" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="704" y="132" width="190" height="84" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="799" y="162" font-size="13.2" fill="#1B4F80" font-weight="bold" text-anchor="middle">detect</text>
  <text x="799" y="185" font-size="10.8" fill="#0F2740" font-weight="normal" text-anchor="middle">withdrawal or timeout</text>
  <line x1="894" y1="174" x2="920" y2="174" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="920" y="132" width="190" height="84" rx="9" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="1015" y="162" font-size="13.2" fill="#1B4F80" font-weight="bold" text-anchor="middle">re-form</text>
  <text x="1015" y="185" font-size="10.8" fill="#0F2740" font-weight="normal" text-anchor="middle">re-derive from remaining agents</text>
  <rect x="180" y="290" width="366" height="112" rx="9" fill="#EFF7F1" stroke="#B9DCC5" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="363" y="320" font-size="14" fill="#1E7A46" font-weight="bold" text-anchor="middle">recovery path</text>
  <text x="363" y="342" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">alternate satisfier exists</text>
  <text x="363" y="364" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">continue execution and complete</text>
  <line x1="920" y1="216" x2="363" y2="290" stroke="#7A8899" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arwMute)"/>
  <rect x="632" y="290" width="366" height="112" rx="9" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="815" y="320" font-size="14" fill="#8A6100" font-weight="bold" text-anchor="middle">explicit decline path</text>
  <text x="815" y="342" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">no remaining team can cover</text>
  <text x="815" y="364" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">raised requirements and goal</text>
  <line x1="920" y1="216" x2="815" y2="290" stroke="#7A8899" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arwMute)"/>
</svg>
