<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" font-family="Times New Roman, Georgia, serif">
  <defs>
    <marker id="w" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#1F4E79"/>
    </marker>
    <marker id="wr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#B02318"/>
    </marker>
  </defs>
  <rect width="1160" height="560" fill="#FFFFFF"/>

  <!-- column headers -->
  <text x="404" y="34" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">FIXED PLAN</text>
  <text x="404" y="53" font-size="12.5" fill="#44546A" text-anchor="middle">computed once, then followed</text>
  <text x="836" y="34" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">RE-FORMING</text>
  <text x="836" y="53" font-size="12.5" fill="#44546A" text-anchor="middle">re-derived from what remains</text>
  <line x1="188" y1="66" x2="1136" y2="66" stroke="#BDD7EE" stroke-width="1.2"/>
  <line x1="620" y1="66" x2="620" y2="540" stroke="#BDD7EE" stroke-width="1.2"/>

  <!-- ROW 1 -->
  <text x="26" y="132" font-size="14" font-weight="bold" fill="#1F4E79">CASE 1</text>
  <text x="26" y="154" font-size="13" fill="#333">withdrawn agent is</text>
  <text x="26" y="172" font-size="13" fill="#333">the only satisfier of</text>
  <text x="26" y="190" font-size="13" fill="#333">a raised requirement</text>
  <text x="26" y="216" font-size="12" fill="#8A8F98">deployed: research,</text>
  <text x="26" y="232" font-size="12" fill="#8A8F98">factcheck, analysis, writer</text>

  <!-- 1A -->
  <g>
    <rect x="200" y="92" width="112" height="38" rx="3" fill="#1F4E79"/>
    <text x="256" y="116" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">research</text>
    <line x1="312" y1="111" x2="342" y2="111" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#w)"/>
    <rect x="348" y="92" width="112" height="38" rx="3" fill="#FFFFFF" stroke="#B02318" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="404" y="116" font-size="13" fill="#B02318" text-anchor="middle">analysis</text>
    <g stroke="#B02318" stroke-width="2.2" stroke-linecap="round"><line x1="397" y1="135" x2="411" y2="149"/><line x1="397" y1="149" x2="411" y2="135"/></g>
    <line x1="460" y1="111" x2="490" y2="111" stroke="#C9CDD2" stroke-width="1.8"/>
    <rect x="496" y="92" width="100" height="38" rx="3" fill="#FFFFFF" stroke="#C9CDD2" stroke-dasharray="3 3"/>
    <text x="546" y="116" font-size="13" fill="#9AA5B1" text-anchor="middle">writer</text>
  </g>
  <rect x="200" y="164" width="396" height="66" rx="3" fill="#FDF0EF" stroke="#E8B5B0"/>
  <text x="212" y="186" font-size="13" font-weight="bold" fill="#B02318">aborted at analysis</text>
  <text x="212" y="205" font-size="12.5" fill="#5C2A26">the call fails; execution stops with no answer and no</text>
  <text x="212" y="222" font-size="12.5" fill="#5C2A26">statement of what went wrong. Detected in 0.00 s.</text>

  <!-- 1B -->
  <g>
    <rect x="632" y="92" width="112" height="38" rx="3" fill="#1F4E79"/>
    <text x="688" y="116" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">research</text>
    <line x1="744" y1="111" x2="774" y2="111" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#w)"/>
    <rect x="780" y="92" width="112" height="38" rx="3" fill="#FFFFFF" stroke="#B02318" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="836" y="116" font-size="13" fill="#B02318" text-anchor="middle">analysis</text>
    <g stroke="#B02318" stroke-width="2.2" stroke-linecap="round"><line x1="829" y1="135" x2="843" y2="149"/><line x1="829" y1="149" x2="843" y2="135"/></g>
    <text x="960" y="116" font-size="12.5" fill="#44546A">re-form &#8594; no path</text>
  </g>
  <rect x="632" y="164" width="500" height="66" rx="3" fill="#FFF8E8" stroke="#E0C97F"/>
  <text x="644" y="186" font-size="13" font-weight="bold" fill="#7A5B12">reported, not attempted</text>
  <text x="644" y="205" font-size="12.5" fill="#5C4A1A">&#8220;no deployed agent satisfies [computation], which this task</text>
  <text x="644" y="222" font-size="12.5" fill="#5C4A1A">requires.&#8221; The work is declined with a reason.</text>

  <!-- ROW 2 -->
  <line x1="188" y1="262" x2="1136" y2="262" stroke="#E4EAF0" stroke-width="1"/>
  <text x="26" y="336" font-size="14" font-weight="bold" fill="#1F4E79">CASE 2</text>
  <text x="26" y="358" font-size="13" fill="#333">a second agent</text>
  <text x="26" y="376" font-size="13" fill="#333">satisfies the same</text>
  <text x="26" y="394" font-size="13" fill="#333">requirement</text>
  <text x="26" y="420" font-size="12" fill="#8A8F98">deployed: as above,</text>
  <text x="26" y="436" font-size="12" fill="#8A8F98">plus compute</text>

  <!-- 2A -->
  <g>
    <rect x="200" y="296" width="112" height="38" rx="3" fill="#1F4E79"/>
    <text x="256" y="320" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">research</text>
    <line x1="312" y1="315" x2="342" y2="315" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#w)"/>
    <rect x="348" y="296" width="112" height="38" rx="3" fill="#FFFFFF" stroke="#B02318" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="404" y="320" font-size="13" fill="#B02318" text-anchor="middle">analysis</text>
    <g stroke="#B02318" stroke-width="2.2" stroke-linecap="round"><line x1="397" y1="339" x2="411" y2="353"/><line x1="397" y1="353" x2="411" y2="339"/></g>
    <line x1="460" y1="315" x2="490" y2="315" stroke="#C9CDD2" stroke-width="1.8"/>
    <rect x="496" y="296" width="100" height="38" rx="3" fill="#FFFFFF" stroke="#C9CDD2" stroke-dasharray="3 3"/>
    <text x="546" y="320" font-size="13" fill="#9AA5B1" text-anchor="middle">writer</text>
  </g>
  <rect x="200" y="368" width="396" height="66" rx="3" fill="#FDF0EF" stroke="#E8B5B0"/>
  <text x="212" y="390" font-size="13" font-weight="bold" fill="#B02318">aborted at analysis</text>
  <text x="212" y="409" font-size="12.5" fill="#5C2A26">an agent able to do the work is running and idle, but</text>
  <text x="212" y="426" font-size="12.5" fill="#5C2A26">the plan cannot be revised to reach it.</text>

  <!-- 2B -->
  <g>
    <rect x="632" y="296" width="106" height="38" rx="3" fill="#1F4E79"/>
    <text x="685" y="320" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">research</text>
    <line x1="738" y1="315" x2="762" y2="315" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#w)"/>
    <rect x="768" y="296" width="100" height="38" rx="3" fill="#FFFFFF" stroke="#B02318" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="818" y="320" font-size="12.5" fill="#B02318" text-anchor="middle">analysis</text>
    <g stroke="#B02318" stroke-width="2.2" stroke-linecap="round"><line x1="812" y1="340" x2="824" y2="352"/><line x1="812" y1="352" x2="824" y2="340"/></g>
    <path d="M868,315 C892,315 892,290 916,290" fill="none" stroke="#2E74B5" stroke-width="1.8" marker-end="url(#w)"/>
    <rect x="922" y="271" width="98" height="38" rx="3" fill="#2E74B5"/>
    <text x="971" y="295" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">compute</text>
    <line x1="1020" y1="290" x2="1042" y2="290" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#w)"/>
    <rect x="1048" y="271" width="84" height="38" rx="3" fill="#1F4E79"/>
    <text x="1090" y="295" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">writer</text>
  </g>
  <rect x="632" y="368" width="500" height="66" rx="3" fill="#EDF6EE" stroke="#A9CDAE"/>
  <text x="644" y="390" font-size="13" font-weight="bold" fill="#1E6B33">recovered and completed</text>
  <text x="644" y="409" font-size="12.5" fill="#24502F">re-formed as compute &#8594; writer. The research step is not</text>
  <text x="644" y="426" font-size="12.5" fill="#24502F">repeated: formation resumes from the material already held.</text>

  <!-- footer -->
  <rect x="26" y="466" width="1108" height="70" rx="3" fill="#F7F9FB" stroke="#D6DEE7"/>
  <text x="44" y="490" font-size="13.5" fill="#333">Recovery depends on capability-level redundancy, not on the re-forming mechanism alone. Because task-aware formation admits an</text>
  <text x="44" y="509" font-size="13.5" fill="#333">agent only when something requires it, every member of a formed team is load-bearing: the precision that makes the team efficient</text>
  <text x="44" y="528" font-size="13.5" fill="#333">also leaves it without slack. Detection is immediate only for a withdrawn process; an unresponsive one would wait for a timeout.</text>
</svg>
