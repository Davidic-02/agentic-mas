<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="600" fill="#FDFEFF"/>
  <text x="50" y="42" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">EXECUTION LIFECYCLE WITH FAILURE HANDLING</text>
  <text x="356" y="42" font-size="12" fill="#7A8899" font-weight="normal">shared path for withdrawal and stalled-agent failures</text>
  <rect x="70" y="90" width="180" height="54" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="160" y="121" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">discover agents</text>
  <line x1="256" y1="117" x2="326" y2="117" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="332" y="90" width="180" height="54" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="422" y="121" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">form + order team</text>
  <line x1="518" y1="117" x2="588" y2="117" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="594" y="90" width="180" height="54" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="684" y="121" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">execute steps</text>
  <rect x="828" y="90" width="282" height="54" rx="10" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1"/>
  <text x="969" y="111" font-size="12.5" fill="#8A6100" font-weight="bold" text-anchor="middle">monitor for interruption</text>
  <text x="969" y="129" font-size="11.5" fill="#8A6100" font-weight="normal" text-anchor="middle">withdrawal or timeout</text>
  <line x1="780" y1="117" x2="822" y2="117" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <line x1="969" y1="144" x2="969" y2="190" stroke="#D6E3F0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="650" y="198" width="254" height="84" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="777" y="226" font-size="12.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">withdrawn process</text>
  <text x="777" y="248" font-size="11.2" fill="#0F2740" font-weight="normal" text-anchor="middle">connection refused immediately</text>
  <text x="777" y="267" font-size="11.2" fill="#1E7A46" font-weight="bold" text-anchor="middle">detected in &lt; 0.01 s</text>
  <rect x="936" y="198" width="174" height="84" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="1023" y="226" font-size="12.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">stalled process</text>
  <text x="1023" y="248" font-size="11.2" fill="#0F2740" font-weight="normal" text-anchor="middle">still reachable</text>
  <text x="1023" y="267" font-size="11.2" fill="#8A6100" font-weight="bold" text-anchor="middle">detected at timeout</text>
  <path d="M777,282 C777,314 690,320 690,346" fill="none" stroke="#1B4F80" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M1023,282 C1023,314 870,320 870,346" fill="none" stroke="#1B4F80" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="602" y="352" width="356" height="56" rx="10" fill="url(#gAccent)" filter="url(#lift)"/>
  <text x="780" y="385" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">re-discover and re-form from produced state</text>
  <line x1="780" y1="414" x2="780" y2="452" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="434" y="458" width="332" height="84" rx="9" fill="#EFF7F1" stroke="#B9DCC5" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="600" y="486" font-size="12.5" fill="#1E7A46" font-weight="bold" text-anchor="middle">recovery path</text>
  <text x="600" y="508" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">alternative capability available</text>
  <text x="600" y="527" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">resume chain and complete</text>
  <rect x="794" y="458" width="332" height="84" rx="9" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="960" y="486" font-size="12.5" fill="#8A6100" font-weight="bold" text-anchor="middle">decline path</text>
  <text x="960" y="508" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">no alternative satisfies requirement</text>
  <text x="960" y="527" font-size="11.5" fill="#0F2740" font-weight="normal" text-anchor="middle">return explicit impossibility</text>
  <line x1="780" y1="452" x2="600" y2="452" stroke="#1B4F80" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="780" y1="452" x2="960" y2="452" stroke="#1B4F80" stroke-width="1.4" marker-end="url(#arw)"/>
</svg>
