<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="560" fill="#FDFEFF"/>
  <line x1="590" y1="30" x2="590" y2="472" stroke="#D6E3F0" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="50" y="48" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">PROCESS WITHDRAWN</text>
  <text x="50" y="70" font-size="12" fill="#7A8899" font-weight="normal">the container is killed</text>
  <rect x="50" y="92" width="196" height="52" rx="9" fill="#FDF3F2" stroke="#B3261E" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="148" y="117" font-size="13.5" fill="#B3261E" font-weight="bold" text-anchor="middle">analysis</text>
  <text x="148" y="135" font-size="10.8" fill="#B3261E" font-weight="normal" text-anchor="middle">process gone</text>
  <rect x="50" y="180" width="492" height="42" rx="8" fill="#FDF3F2" stroke="#EFC6C2" stroke-width="1"/>
  <text x="66" y="206" font-size="12.2" fill="#0F2740" font-weight="normal">TCP connection</text>
  <text x="526" y="206" font-size="12.2" fill="#B3261E" font-weight="bold" text-anchor="end">refused</text>
  <rect x="50" y="232" width="492" height="42" rx="8" fill="#FDF3F2" stroke="#EFC6C2" stroke-width="1"/>
  <text x="66" y="258" font-size="12.2" fill="#0F2740" font-weight="normal">Readiness probe (fetches the card)</text>
  <text x="526" y="258" font-size="12.2" fill="#B3261E" font-weight="bold" text-anchor="end">fails</text>
  <rect x="50" y="284" width="492" height="42" rx="8" fill="#EFF7F1" stroke="#B9DCC5" stroke-width="1"/>
  <text x="66" y="310" font-size="12.2" fill="#0F2740" font-weight="normal">Kubernetes response</text>
  <text x="526" y="310" font-size="12.2" fill="#1E7A46" font-weight="bold" text-anchor="end">pod removed from service</text>
  <rect x="50" y="336" width="492" height="42" rx="8" fill="#EFF7F1" stroke="#B9DCC5" stroke-width="1"/>
  <text x="66" y="362" font-size="12.2" fill="#0F2740" font-weight="normal">Detected after</text>
  <text x="526" y="362" font-size="12.2" fill="#1E7A46" font-weight="bold" text-anchor="end">&lt; 0.01 s</text>
  <rect x="50" y="392" width="492" height="56" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <text x="66" y="416" font-size="12.4" fill="#1B4F80" font-weight="bold">The failure is visible to the platform.</text>
  <text x="66" y="436" font-size="11.8" fill="#0F2740" font-weight="normal">Every signal agrees, and the caller learns immediately.</text>
  <g stroke="#B3261E" stroke-width="2.1" stroke-linecap="round"><line x1="141.5" y1="153.5" x2="154.5" y2="166.5"/><line x1="141.5" y1="166.5" x2="154.5" y2="153.5"/></g>
  <text x="632" y="48" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">PROCESS UNRESPONSIVE</text>
  <text x="632" y="70" font-size="12" fill="#7A8899" font-weight="normal">the container runs but stops progressing</text>
  <rect x="632" y="92" width="196" height="52" rx="9" fill="#FFF9EC" stroke="#8A6100" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="730" y="117" font-size="13.5" fill="#8A6100" font-weight="bold" text-anchor="middle">analysis</text>
  <text x="730" y="135" font-size="10.8" fill="#8A6100" font-weight="normal" text-anchor="middle">alive, not progressing</text>
  <rect x="632" y="180" width="492" height="42" rx="8" fill="#EFF7F1" stroke="#B9DCC5" stroke-width="1"/>
  <text x="648" y="206" font-size="12.2" fill="#0F2740" font-weight="normal">TCP connection</text>
  <text x="1108" y="206" font-size="12.2" fill="#1E7A46" font-weight="bold" text-anchor="end">accepted</text>
  <rect x="632" y="232" width="492" height="42" rx="8" fill="#FDF3F2" stroke="#EFC6C2" stroke-width="1"/>
  <text x="648" y="258" font-size="12.2" fill="#0F2740" font-weight="normal">Readiness probe (fetches the card)</text>
  <text x="1108" y="258" font-size="12.2" fill="#B3261E" font-weight="bold" text-anchor="end">passes</text>
  <rect x="632" y="284" width="492" height="42" rx="8" fill="#FDF3F2" stroke="#EFC6C2" stroke-width="1"/>
  <text x="648" y="310" font-size="12.2" fill="#0F2740" font-weight="normal">Kubernetes response</text>
  <text x="1108" y="310" font-size="12.2" fill="#B3261E" font-weight="bold" text-anchor="end">pod kept in service</text>
  <rect x="632" y="336" width="492" height="42" rx="8" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1"/>
  <text x="648" y="362" font-size="12.2" fill="#0F2740" font-weight="normal">Detected after</text>
  <text x="1108" y="362" font-size="12.2" fill="#8A6100" font-weight="bold" text-anchor="end">the caller's timeout</text>
  <rect x="632" y="392" width="492" height="56" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <text x="648" y="416" font-size="12.4" fill="#1B4F80" font-weight="bold">The failure is invisible to the platform.</text>
  <text x="648" y="436" font-size="11.8" fill="#0F2740" font-weight="normal">Discovery returns it, formation selects it, no work is done.</text>
  <rect x="28" y="472" width="1124" height="68" rx="10" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1"/>
  <text x="50" y="498" font-size="12.2" fill="#0F2740" font-weight="normal">A probe that fetches an agent's capability card asks whether the agent can describe itself, not whether it is doing any work. In the</text>
  <text x="50" y="517" font-size="12.2" fill="#0F2740" font-weight="normal">right-hand column every health signal available to the system reports normality throughout. Detection is not a property the system</text>
  <text x="50" y="536" font-size="12.2" fill="#0F2740" font-weight="normal">has; it is a timeout the caller chose, and until it expires the stalled agent remains a candidate for selection.</text>
</svg>
