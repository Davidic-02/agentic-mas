<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="730" viewBox="0 0 1180 730" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="730" fill="#FDFEFF"/>
  <text x="50" y="44" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">TASK-AWARE RUNTIME FORMATION</text>
  <text x="298" y="44" font-size="12" fill="#7A8899" font-weight="normal">workflow from task text to execution or explicit decline</text>
  <rect x="34" y="92" width="172" height="94" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="120.0" y="122" font-size="12.7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">task text</text>
  <text x="120.0" y="145" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">natural-language query</text>
  <text x="120.0" y="164" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">arrives at coordinator</text>
  <line x1="210" y1="139.0" x2="216" y2="139.0" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="220" y="92" width="172" height="94" rx="10" fill="url(#gAccent)" filter="url(#lift)"/>
  <text x="306.0" y="122" font-size="12.7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">requirement profiling</text>
  <text x="306.0" y="145" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">keyword profiler maps</text>
  <text x="306.0" y="164" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">task to markers R</text>
  <line x1="396" y1="139.0" x2="402" y2="139.0" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="406" y="92" width="172" height="94" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="492.0" y="122" font-size="12.7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">capability discovery</text>
  <text x="492.0" y="145" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">list deployed agents</text>
  <text x="492.0" y="164" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">and read A2A cards</text>
  <line x1="582" y1="139.0" x2="588" y2="139.0" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="592" y="92" width="172" height="94" rx="10" fill="url(#gAccent)" filter="url(#lift)"/>
  <text x="678.0" y="122" font-size="12.7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">candidate-team search</text>
  <text x="678.0" y="145" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">minimum-cardinality set</text>
  <text x="678.0" y="164" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">covering goal and R</text>
  <line x1="768" y1="139.0" x2="774" y2="139.0" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="778" y="92" width="172" height="94" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="864.0" y="122" font-size="12.7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ordering</text>
  <text x="864.0" y="145" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">prefer refiners before</text>
  <text x="864.0" y="164" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">transformers for stability</text>
  <line x1="954" y1="139.0" x2="960" y2="139.0" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="964" y="92" width="172" height="94" rx="10" fill="url(#gAccent)" filter="url(#lift)"/>
  <text x="1050.0" y="122" font-size="12.7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">decision</text>
  <text x="1050.0" y="145" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">execute formed team</text>
  <text x="1050.0" y="164" font-size="11" fill="#DCEBF8" font-weight="normal" text-anchor="middle">or report missing capability</text>
  <rect x="34" y="224" width="1118" height="72" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="50" y="248" font-size="12.5" fill="#1B4F80" font-weight="bold">optimisation target</text>
  <text x="50" y="268" font-size="11.8" fill="#0F2740" font-weight="normal">T* = arg min_T |T|  subject to  goal ∈ A(T)  and  R ⊆ ⋃_{a ∈ T} S_a</text>
  <text x="50" y="285" font-size="11.8" fill="#0F2740" font-weight="normal">A task is attempted only when both reachability and requirement coverage hold.</text>
  <rect x="34" y="324" width="1118" height="154" rx="10" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <text x="56" y="350" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">COMPARISON BASELINE</text>
  <text x="56" y="378" font-size="11.8" fill="#1B4F80" font-weight="bold">static composition</text>
  <text x="268" y="378" font-size="11.5" fill="#0F2740" font-weight="normal">team hardcoded in source</text>
  <text x="652" y="378" font-size="11.5" fill="#B3261E" font-weight="normal">requires edits when deployment changes</text>
  <text x="56" y="408" font-size="11.8" fill="#1B4F80" font-weight="bold">task-blind formation</text>
  <text x="268" y="408" font-size="11.5" fill="#0F2740" font-weight="normal">team from eligibility only</text>
  <text x="652" y="408" font-size="11.5" fill="#8A6100" font-weight="normal">recruits unnecessary agents</text>
  <text x="56" y="438" font-size="11.8" fill="#1B4F80" font-weight="bold">task-aware formation</text>
  <text x="268" y="438" font-size="11.5" fill="#0F2740" font-weight="normal">team from need plus marker coverage</text>
  <text x="652" y="438" font-size="11.5" fill="#1E7A46" font-weight="normal">reports impossibility explicitly</text>
  <rect x="34" y="506" width="1118" height="192" rx="10" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1"/>
  <text x="56" y="532" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">FAILURE HANDLING IN EXECUTION</text>
  <rect x="76" y="548" width="138" height="48" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="145" y="577" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">discovery</text>
  <line x1="220" y1="572" x2="230" y2="572" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="236" y="548" width="138" height="48" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="305" y="577" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">execution</text>
  <line x1="380" y1="572" x2="390" y2="572" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="396" y="548" width="226" height="48" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="509" y="577" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">withdrawal / timeout detection</text>
  <line x1="628" y1="572" x2="640" y2="572" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="646" y="548" width="138" height="48" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="715" y="577" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">re-formation</text>
  <line x1="790" y1="572" x2="800" y2="572" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="806" y="548" width="138" height="48" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="875" y="577" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">recover or decline</text>
  <text x="56" y="624" font-size="11.5" fill="#0F2740" font-weight="normal">withdrawn process: immediate refusal; stalled process: detected at caller timeout</text>
  <text x="56" y="646" font-size="11.5" fill="#0F2740" font-weight="normal">re-formation resumes from produced material, then either recovers with redundancy or declines with requirement named</text>
</svg>
