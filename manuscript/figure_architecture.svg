<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="Times New Roman, Georgia, serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect width="1160" height="700" fill="#FFFFFF"/>

  <!-- request -->
  <rect x="470" y="20" width="220" height="38" rx="4" fill="#FFFFFF" stroke="#44546A" stroke-width="1.4"/>
  <text x="580" y="45" font-size="15" fill="#222" text-anchor="middle">user question</text>
  <line x1="580" y1="58" x2="580" y2="84" stroke="#1F4E79" stroke-width="2" marker-end="url(#d)"/>

  <!-- coordinator -->
  <rect x="330" y="90" width="500" height="86" rx="5" fill="#1F4E79"/>
  <text x="580" y="119" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">coordinator</text>
  <text x="580" y="142" font-size="13" fill="#CFE0F0" text-anchor="middle">discovers deployed agents &#183; reads their cards</text>
  <text x="580" y="162" font-size="13" fill="#CFE0F0" text-anchor="middle">profiles the task &#183; derives the team and its order</text>

  <!-- queries k8s -->
  <line x1="330" y1="133" x2="196" y2="133" stroke="#2E74B5" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#d)"/>
  <rect x="26" y="112" width="168" height="44" rx="4" fill="#EEF3F8" stroke="#2E74B5" stroke-width="1.3"/>
  <text x="110" y="132" font-size="13" fill="#1F4E79" text-anchor="middle">Kubernetes API</text>
  <text x="110" y="148" font-size="11.5" fill="#44546A" text-anchor="middle">list Services by label</text>

  <!-- A2A band -->
  <rect x="26" y="196" width="1108" height="30" rx="3" fill="#DEEBF7"/>
  <text x="44" y="216" font-size="13.5" font-weight="bold" fill="#1F4E79">A2A</text>
  <text x="92" y="216" font-size="13" fill="#44546A">agent &#8596; agent &#183; capability cards published at a well-known endpoint &#183; tasks over JSON-RPC</text>

  <!-- agents -->
  <g>
    <rect x="34" y="250" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="134" y="275" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">research</text>
    <text x="134" y="296" font-size="12" fill="#444" text-anchor="middle">query &#8594; findings</text>
    <text x="134" y="314" font-size="11.5" fill="#8A8F98" text-anchor="middle">pod &#183; service &#183; probe</text>
  </g>
  <g>
    <rect x="252" y="250" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="352" y="275" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">factcheck</text>
    <text x="352" y="296" font-size="12" fill="#444" text-anchor="middle">findings &#8594; findings</text>
    <text x="352" y="314" font-size="11.5" fill="#8A8F98" text-anchor="middle">satisfies verification</text>
  </g>
  <g>
    <rect x="470" y="250" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="570" y="275" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">analysis</text>
    <text x="570" y="296" font-size="12" fill="#444" text-anchor="middle">findings &#8594; conclusions</text>
    <text x="570" y="314" font-size="11.5" fill="#8A8F98" text-anchor="middle">satisfies computation</text>
  </g>
  <g>
    <rect x="688" y="250" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="788" y="275" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">compute</text>
    <text x="788" y="296" font-size="12" fill="#444" text-anchor="middle">findings &#8594; conclusions</text>
    <text x="788" y="314" font-size="11.5" fill="#8A8F98" text-anchor="middle">satisfies computation</text>
  </g>
  <g>
    <rect x="906" y="250" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="1006" y="275" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">writer</text>
    <text x="1006" y="296" font-size="12" fill="#444" text-anchor="middle">findings &#8594; report</text>
    <text x="1006" y="314" font-size="11.5" fill="#8A8F98" text-anchor="middle">pod &#183; service &#183; probe</text>
  </g>

  <!-- MCP band -->
  <rect x="26" y="356" width="1108" height="30" rx="3" fill="#DEEBF7"/>
  <text x="44" y="376" font-size="13.5" font-weight="bold" fill="#1F4E79">MCP</text>
  <text x="92" y="376" font-size="13" fill="#44546A">agent &#8596; tool &#183; each agent discovers the available tools from the server at start-up</text>

  <!-- vertical links agents -> mcp -->
  <line x1="134" y1="324" x2="134" y2="354" stroke="#1F4E79" stroke-width="1.6"/>
  <line x1="352" y1="324" x2="352" y2="354" stroke="#1F4E79" stroke-width="1.6"/>
  <line x1="570" y1="324" x2="570" y2="354" stroke="#1F4E79" stroke-width="1.6"/>
  <line x1="788" y1="324" x2="788" y2="354" stroke="#1F4E79" stroke-width="1.6"/>
  <line x1="1006" y1="324" x2="1006" y2="354" stroke="#1F4E79" stroke-width="1.6"/>

  <!-- MCP server -->
  <rect x="390" y="410" width="380" height="72" rx="4" fill="#2E74B5"/>
  <text x="580" y="436" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MCP server</text>
  <text x="580" y="458" font-size="12.5" fill="#DDEAF6" text-anchor="middle">search_documents &#183; calculate</text>
  <text x="580" y="475" font-size="11.5" fill="#BBD3EA" text-anchor="middle">no agent imports a tool function directly</text>
  <line x1="580" y1="386" x2="580" y2="408" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="580" y1="482" x2="580" y2="506" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#d)"/>
  <rect x="440" y="508" width="280" height="34" rx="4" fill="#FFFFFF" stroke="#44546A" stroke-width="1.3"/>
  <text x="580" y="530" font-size="13" fill="#222" text-anchor="middle">document corpus</text>

  <!-- cloud-native band -->
  <rect x="26" y="570" width="1108" height="106" rx="4" fill="#F5F9FD" stroke="#BDD7EE" stroke-width="1.2"/>
  <rect x="26" y="570" width="5" height="106" fill="#1F4E79"/>
  <text x="46" y="595" font-size="15" font-weight="bold" fill="#1F4E79">CLOUD-NATIVE LAYER</text>
  <text x="252" y="595" font-size="13" fill="#44546A">every agent above is an independently deployed workload</text>
  <g font-size="12.5" fill="#333">
    <rect x="48" y="610" width="196" height="50" rx="3" fill="#FFFFFF" stroke="#BDD7EE"/>
    <text x="146" y="631" text-anchor="middle" font-weight="bold" fill="#1F4E79">Deployment</text>
    <text x="146" y="649" text-anchor="middle">one per agent role</text>
    <rect x="262" y="610" width="196" height="50" rx="3" fill="#FFFFFF" stroke="#BDD7EE"/>
    <text x="360" y="631" text-anchor="middle" font-weight="bold" fill="#1F4E79">Service</text>
    <text x="360" y="649" text-anchor="middle">stable name, load balanced</text>
    <rect x="476" y="610" width="196" height="50" rx="3" fill="#FFFFFF" stroke="#BDD7EE"/>
    <text x="574" y="631" text-anchor="middle" font-weight="bold" fill="#1F4E79">Readiness probe</text>
    <text x="574" y="649" text-anchor="middle">fetches the agent card</text>
    <rect x="690" y="610" width="196" height="50" rx="3" fill="#FFFFFF" stroke="#BDD7EE"/>
    <text x="788" y="631" text-anchor="middle" font-weight="bold" fill="#1F4E79">Replicas</text>
    <text x="788" y="649" text-anchor="middle">scaled per agent</text>
    <rect x="904" y="610" width="196" height="50" rx="3" fill="#FFFFFF" stroke="#BDD7EE"/>
    <text x="1002" y="631" text-anchor="middle" font-weight="bold" fill="#1F4E79">Label</text>
    <text x="1002" y="649" text-anchor="middle">a2a.agent/enabled</text>
  </g>
</svg>
