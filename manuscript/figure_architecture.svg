<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="730" viewBox="0 0 1180 730" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="730" fill="#FDFEFF"/>
  <rect x="468" y="24" width="244" height="40" rx="20" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="590" y="50" font-size="13.5" fill="#0F2740" font-weight="normal" text-anchor="middle">user question</text>
  <line x1="590" y1="64" x2="590" y2="92" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="300" y="98" width="580" height="92" rx="11" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="590" y="128" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">coordinator</text>
  <text x="590" y="152" font-size="12.5" fill="#C6DBEE" font-weight="normal" text-anchor="middle">discovers deployed agents · reads their cards</text>
  <text x="590" y="172" font-size="12.5" fill="#C6DBEE" font-weight="normal" text-anchor="middle">profiles the task · derives the team and its order</text>
  <line x1="300" y1="144" x2="212" y2="144" stroke="#2E74B5" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="28" y="120" width="178" height="50" rx="9" fill="#F4F8FC" stroke="#BFD6EA" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="117" y="141" font-size="12.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">Kubernetes API</text>
  <text x="117" y="158" font-size="11" fill="#7A8899" font-weight="normal" text-anchor="middle">list Services by label</text>
  <rect x="28" y="212" width="1124" height="34" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <rect x="28" y="212" width="4" height="34" rx="2" fill="#1B4F80"/>
  <text x="50" y="234" font-size="13" fill="#1B4F80" font-weight="bold">A2A</text>
  <text x="96" y="234" font-size="12" fill="#7A8899" font-weight="normal">agent ↔ agent  ·  capability cards at a well-known endpoint  ·  tasks over JSON-RPC</text>
  <rect x="34" y="272" width="212" height="88" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="140.0" y="300" font-size="14.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">research</text>
  <text x="140.0" y="322" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">query → findings</text>
  <text x="140.0" y="343" font-size="11" fill="#D6E3F0" font-weight="normal" text-anchor="middle">·</text>
  <rect x="256" y="272" width="212" height="88" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="362.0" y="300" font-size="14.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">factcheck</text>
  <text x="362.0" y="322" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">findings → findings</text>
  <text x="362.0" y="343" font-size="11" fill="#3E8FD0" font-weight="normal" text-anchor="middle">satisfies verification</text>
  <rect x="478" y="272" width="212" height="88" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="584.0" y="300" font-size="14.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">analysis</text>
  <text x="584.0" y="322" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">findings → conclusions</text>
  <text x="584.0" y="343" font-size="11" fill="#3E8FD0" font-weight="normal" text-anchor="middle">satisfies computation</text>
  <rect x="700" y="272" width="212" height="88" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="806.0" y="300" font-size="14.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">compute</text>
  <text x="806.0" y="322" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">findings → conclusions</text>
  <text x="806.0" y="343" font-size="11" fill="#3E8FD0" font-weight="normal" text-anchor="middle">satisfies computation</text>
  <rect x="922" y="272" width="212" height="88" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="1028.0" y="300" font-size="14.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">writer</text>
  <text x="1028.0" y="322" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">findings → report</text>
  <text x="1028.0" y="343" font-size="11" fill="#D6E3F0" font-weight="normal" text-anchor="middle">·</text>
  <line x1="140.0" y1="360" x2="140.0" y2="392" stroke="#D6E3F0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="362.0" y1="360" x2="362.0" y2="392" stroke="#D6E3F0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="584.0" y1="360" x2="584.0" y2="392" stroke="#D6E3F0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="806.0" y1="360" x2="806.0" y2="392" stroke="#D6E3F0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="1028.0" y1="360" x2="1028.0" y2="392" stroke="#D6E3F0" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="28" y="392" width="1124" height="34" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <rect x="28" y="392" width="4" height="34" rx="2" fill="#1B4F80"/>
  <text x="50" y="414" font-size="13" fill="#1B4F80" font-weight="bold">MCP</text>
  <text x="96" y="414" font-size="12" fill="#7A8899" font-weight="normal">agent ↔ tool  ·  each agent discovers the available tools from the server at start-up</text>
  <line x1="590" y1="426" x2="590" y2="450" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="378" y="456" width="424" height="80" rx="11" fill="url(#gAccent)" filter="url(#lift)"/>
  <text x="590" y="484" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">MCP server</text>
  <text x="590" y="506" font-size="12.2" fill="#DCEBF8" font-weight="normal" text-anchor="middle">search_documents  ·  calculate</text>
  <text x="590" y="525" font-size="11" fill="#B9D4EC" font-weight="normal" text-anchor="middle">no agent imports a tool function directly</text>
  <line x1="590" y1="536" x2="590" y2="562" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="452" y="568" width="276" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="590" y="592" font-size="12.5" fill="#0F2740" font-weight="normal" text-anchor="middle">document corpus</text>
  <rect x="28" y="632" width="1124" height="76" rx="10" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <rect x="28" y="632" width="4" height="76" rx="2" fill="#1B4F80"/>
  <text x="50" y="656" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">CLOUD-NATIVE LAYER</text>
  <text x="196" y="656" font-size="12" fill="#7A8899" font-weight="normal">every agent above is an independently deployed workload</text>
  <rect x="50" y="666" width="208" height="32" rx="7" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="154.0" y="680" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">Deployment</text>
  <text x="154.0" y="693" font-size="10.5" fill="#7A8899" font-weight="normal" text-anchor="middle">one per agent role</text>
  <rect x="268" y="666" width="208" height="32" rx="7" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="372.0" y="680" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">Service</text>
  <text x="372.0" y="693" font-size="10.5" fill="#7A8899" font-weight="normal" text-anchor="middle">stable, balanced</text>
  <rect x="486" y="666" width="208" height="32" rx="7" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="590.0" y="680" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">Readiness probe</text>
  <text x="590.0" y="693" font-size="10.5" fill="#7A8899" font-weight="normal" text-anchor="middle">fetches the agent card</text>
  <rect x="704" y="666" width="208" height="32" rx="7" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="808.0" y="680" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">Replicas</text>
  <text x="808.0" y="693" font-size="10.5" fill="#7A8899" font-weight="normal" text-anchor="middle">scaled per agent</text>
  <rect x="922" y="666" width="208" height="32" rx="7" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="1026.0" y="680" font-size="11.5" fill="#1B4F80" font-weight="bold" text-anchor="middle">Label</text>
  <text x="1026.0" y="693" font-size="10.5" fill="#7A8899" font-weight="normal" text-anchor="middle">a2a.agent/enabled</text>
</svg>
