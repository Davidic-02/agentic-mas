<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="690" fill="#FDFEFF"/>
  <rect x="28" y="24" width="1124" height="158" rx="10" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <rect x="28" y="24" width="4" height="158" rx="2" fill="#1B4F80"/>
  <text x="50" y="50" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">DEPLOYED IN THE CLUSTER</text>
  <text x="268" y="50" font-size="12" fill="#7A8899" font-weight="normal">identical for both tasks — four agents, discovered by label</text>
  <rect x="50" y="64" width="262" height="102" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="181.0" y="90" font-size="15" fill="#1B4F80" font-weight="bold" text-anchor="middle">research</text>
  <text x="181.0" y="112" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">consumes  query</text>
  <text x="181.0" y="130" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">produces  findings</text>
  <text x="181.0" y="152" font-size="11" fill="#D6E3F0" font-weight="normal" text-anchor="middle">·</text>
  <rect x="326" y="64" width="262" height="102" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="457.0" y="90" font-size="15" fill="#1B4F80" font-weight="bold" text-anchor="middle">factcheck</text>
  <text x="457.0" y="112" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">consumes  findings</text>
  <text x="457.0" y="130" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">produces  findings</text>
  <text x="457.0" y="152" font-size="11" fill="#3E8FD0" font-weight="normal" text-anchor="middle">satisfies  verification</text>
  <rect x="602" y="64" width="262" height="102" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="733.0" y="90" font-size="15" fill="#1B4F80" font-weight="bold" text-anchor="middle">analysis</text>
  <text x="733.0" y="112" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">consumes  findings</text>
  <text x="733.0" y="130" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">produces  conclusions</text>
  <text x="733.0" y="152" font-size="11" fill="#3E8FD0" font-weight="normal" text-anchor="middle">satisfies  computation</text>
  <rect x="878" y="64" width="262" height="102" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="1009.0" y="90" font-size="15" fill="#1B4F80" font-weight="bold" text-anchor="middle">writer</text>
  <text x="1009.0" y="112" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">consumes  findings</text>
  <text x="1009.0" y="130" font-size="11.8" fill="#0F2740" font-weight="normal" text-anchor="middle">produces  report</text>
  <text x="1009.0" y="152" font-size="11" fill="#D6E3F0" font-weight="normal" text-anchor="middle">·</text>
  <line x1="590" y1="212" x2="590" y2="654" stroke="#D6E3F0" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="50" y="240" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">TASK A</text>
  <text x="50" y="268" font-size="13.5" fill="#0F2740" font-weight="normal">“How many probe types does Kubernetes have?”</text>
  <rect x="50" y="286" width="492" height="36" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <text x="66" y="309" font-size="11.8" fill="#7A8899" font-weight="normal">requirements raised</text>
  <text x="218" y="309" font-size="12.2" fill="#7A8899" font-weight="bold">none</text>
  <rect x="50" y="352" width="132" height="44" rx="9" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="116.0" y="379" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">research</text>
  <line x1="188" y1="374" x2="222" y2="374" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="228" y="352" width="132" height="44" rx="9" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="294.0" y="379" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">writer</text>
  <text x="372" y="379" font-size="12.5" fill="#1B4F80" font-weight="bold">→  report</text>
  <text x="50" y="452" font-size="11.5" fill="#7A8899" font-weight="normal">not recruited</text>
  <rect x="50" y="464" width="136" height="36" rx="8" fill="none" stroke="#D6E3F0" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="118" y="487" font-size="12.5" fill="#7A8899" font-weight="normal" text-anchor="middle">factcheck</text>
  <rect x="200" y="464" width="136" height="36" rx="8" fill="none" stroke="#D6E3F0" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="268" y="487" font-size="12.5" fill="#7A8899" font-weight="normal" text-anchor="middle">analysis</text>
  <rect x="50" y="524" width="492" height="66" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="66" y="548" font-size="12.5" fill="#1B4F80" font-weight="bold">Team of 2</text>
  <text x="66" y="568" font-size="11.8" fill="#0F2740" font-weight="normal">Precision 1.00 against the required set</text>
  <text x="66" y="585" font-size="11.8" fill="#0F2740" font-weight="normal">{research, writer}. Two model calls, not four.</text>
  <text x="632" y="240" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">TASK B</text>
  <text x="632" y="268" font-size="13.5" fill="#0F2740" font-weight="normal">“How many failure modes per category on average?”</text>
  <rect x="632" y="286" width="492" height="36" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <text x="648" y="309" font-size="11.8" fill="#7A8899" font-weight="normal">requirements raised</text>
  <text x="800" y="309" font-size="12.2" fill="#1B4F80" font-weight="bold">computation</text>
  <rect x="632" y="352" width="132" height="44" rx="9" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="698.0" y="379" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">research</text>
  <line x1="770" y1="374" x2="804" y2="374" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="810" y="352" width="132" height="44" rx="9" fill="url(#gAccent)" filter="url(#lift)"/>
  <text x="876.0" y="379" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">analysis</text>
  <line x1="948" y1="374" x2="982" y2="374" stroke="#1B4F80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw)"/>
  <rect x="988" y="352" width="132" height="44" rx="9" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="1054.0" y="379" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">writer</text>
  <text x="1132" y="379" font-size="12.5" fill="#1B4F80" font-weight="bold">→  report</text>
  <text x="876" y="414" font-size="10.8" fill="#3E8FD0" font-weight="normal" text-anchor="middle">recruited to satisfy the requirement</text>
  <text x="632" y="452" font-size="11.5" fill="#7A8899" font-weight="normal">not recruited</text>
  <rect x="632" y="464" width="136" height="36" rx="8" fill="none" stroke="#D6E3F0" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="700" y="487" font-size="12.5" fill="#7A8899" font-weight="normal" text-anchor="middle">factcheck</text>
  <rect x="632" y="524" width="492" height="66" rx="8" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1.1"/>
  <text x="648" y="548" font-size="12.5" fill="#1B4F80" font-weight="bold">Team of 3</text>
  <text x="648" y="568" font-size="11.8" fill="#0F2740" font-weight="normal">Precision 1.00 against the required set</text>
  <text x="648" y="585" font-size="11.8" fill="#0F2740" font-weight="normal">{research, analysis, writer}.</text>
  <rect x="28" y="612" width="1124" height="60" rx="10" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1"/>
  <text x="50" y="636" font-size="12.5" fill="#0F2740" font-weight="normal">Nothing in the coordinator changed between the panels, and nothing in the cluster changed. The team differs because the task differs.</text>
  <text x="50" y="656" font-size="12.5" fill="#0F2740" font-weight="normal">Under task-blind formation both panels yield research → factcheck → analysis → writer, irrespective of need.</text>
</svg>
