<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" font-family="Arial">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23598C"/>
      <stop offset="100%" stop-color="#1B4F80"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D84C4"/>
      <stop offset="100%" stop-color="#2E74B5"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="2.2"
                    flood-color="#0F2740" flood-opacity="0.13"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6"
                    flood-color="#0F2740" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#1B4F80"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwMute" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,1 L7,4 L0.5,7" fill="none" stroke="#7A8899"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="690" fill="#FDFEFF"/>
  <text x="50" y="40" font-size="10.5" fill="#1B4F80" font-weight="bold" letter-spacing="1.3">THREE COMPOSITION STRATEGIES, ONE DEPLOYMENT</text>
  <text x="360" y="40" font-size="12" fill="#7A8899" font-weight="normal">research · factcheck · analysis · writer available in all cases</text>
  <rect x="50" y="66" width="340" height="54" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="220" y="96" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">static composition</text>
  <text x="220" y="116" font-size="10.8" fill="#DCEBF8" font-weight="normal" text-anchor="middle">author-defined team</text>
  <rect x="50" y="140" width="340" height="354" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="66" y="172" font-size="11.6" fill="#7A8899" font-weight="normal">decision basis</text>
  <text x="66" y="194" font-size="12.2" fill="#0F2740" font-weight="normal">team fixed in source</text>
  <line x1="66" y1="206" x2="374" y2="206" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="226" font-size="11.6" fill="#7A8899" font-weight="normal">with analysis withdrawn</text>
  <text x="66" y="248" font-size="12.2" fill="#0F2740" font-weight="normal">fails at analysis call after earlier steps ran</text>
  <line x1="66" y1="260" x2="374" y2="260" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="280" font-size="11.6" fill="#7A8899" font-weight="normal">extra deployed agent</text>
  <text x="66" y="302" font-size="12.2" fill="#0F2740" font-weight="normal">ignored until code is edited</text>
  <line x1="66" y1="314" x2="374" y2="314" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="334" font-size="11.6" fill="#7A8899" font-weight="normal">source edits across scenarios</text>
  <text x="66" y="356" font-size="12.2" fill="#0F2740" font-weight="normal">42</text>
  <line x1="66" y1="368" x2="374" y2="368" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="388" font-size="11.6" fill="#7A8899" font-weight="normal">typical team</text>
  <text x="66" y="410" font-size="12.2" fill="#0F2740" font-weight="normal">research → analysis → writer</text>
  <rect x="50" y="512" width="340" height="86" rx="8" fill="#FDF3F2" stroke="#EFC6C2" stroke-width="1.1"/>
  <text x="66" y="536" font-size="12.5" fill="#B3261E" font-weight="bold">deployment-coupled</text>
  <text x="66" y="556" font-size="11.8" fill="#0F2740" font-weight="normal">correctness depends on keeping source</text>
  <text x="66" y="573" font-size="11.8" fill="#0F2740" font-weight="normal">synchronised with cluster changes</text>
  <rect x="420" y="66" width="340" height="54" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="590" y="96" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">task-blind formation</text>
  <text x="590" y="116" font-size="10.8" fill="#DCEBF8" font-weight="normal" text-anchor="middle">eligibility without task context</text>
  <rect x="420" y="140" width="340" height="354" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="436" y="172" font-size="11.6" fill="#7A8899" font-weight="normal">decision basis</text>
  <text x="436" y="194" font-size="12.2" fill="#0F2740" font-weight="normal">all currently eligible agents</text>
  <line x1="436" y1="206" x2="744" y2="206" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="436" y="226" font-size="11.6" fill="#7A8899" font-weight="normal">with analysis withdrawn</text>
  <text x="436" y="248" font-size="12.2" fill="#0F2740" font-weight="normal">may still report completion with inadequate team</text>
  <line x1="436" y1="260" x2="744" y2="260" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="436" y="280" font-size="11.6" fill="#7A8899" font-weight="normal">extra deployed agent</text>
  <text x="436" y="302" font-size="12.2" fill="#0F2740" font-weight="normal">included whether needed or not</text>
  <line x1="436" y1="314" x2="744" y2="314" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="436" y="334" font-size="11.6" fill="#7A8899" font-weight="normal">source edits across scenarios</text>
  <text x="436" y="356" font-size="12.2" fill="#0F2740" font-weight="normal">0</text>
  <line x1="436" y1="368" x2="744" y2="368" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="436" y="388" font-size="11.6" fill="#7A8899" font-weight="normal">typical team</text>
  <text x="436" y="410" font-size="12.2" fill="#0F2740" font-weight="normal">research → factcheck → analysis → writer</text>
  <rect x="420" y="512" width="340" height="86" rx="8" fill="#FFF9EC" stroke="#E8D3A0" stroke-width="1.1"/>
  <text x="436" y="536" font-size="12.5" fill="#8A6100" font-weight="bold">adaptive but inefficient</text>
  <text x="436" y="556" font-size="11.8" fill="#0F2740" font-weight="normal">recruits unnecessary members and can</text>
  <text x="436" y="573" font-size="11.8" fill="#0F2740" font-weight="normal">mask impossible tasks</text>
  <rect x="790" y="66" width="340" height="54" rx="10" fill="url(#gPrimary)" filter="url(#lift)"/>
  <text x="960" y="96" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">task-aware formation</text>
  <text x="960" y="116" font-size="10.8" fill="#DCEBF8" font-weight="normal" text-anchor="middle">profiles requirements before selecting</text>
  <rect x="790" y="140" width="340" height="354" rx="9" fill="#FFFFFF" stroke="#D6E3F0" stroke-width="1.1" filter="url(#liftSoft)"/>
  <text x="806" y="172" font-size="11.6" fill="#7A8899" font-weight="normal">decision basis</text>
  <text x="806" y="194" font-size="12.2" fill="#0F2740" font-weight="normal">minimum team satisfying goal + R</text>
  <line x1="806" y1="206" x2="1114" y2="206" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="806" y="226" font-size="11.6" fill="#7A8899" font-weight="normal">with analysis withdrawn</text>
  <text x="806" y="248" font-size="12.2" fill="#0F2740" font-weight="normal">declines computation tasks, names missing capability</text>
  <line x1="806" y1="260" x2="1114" y2="260" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="806" y="280" font-size="11.6" fill="#7A8899" font-weight="normal">extra deployed agent</text>
  <text x="806" y="302" font-size="12.2" fill="#0F2740" font-weight="normal">used only when task requires its marker</text>
  <line x1="806" y1="314" x2="1114" y2="314" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="806" y="334" font-size="11.6" fill="#7A8899" font-weight="normal">source edits across scenarios</text>
  <text x="806" y="356" font-size="12.2" fill="#0F2740" font-weight="normal">0</text>
  <line x1="806" y1="368" x2="1114" y2="368" stroke="#EAF0F6" stroke-width="1" stroke-linecap="round"/>
  <text x="806" y="388" font-size="11.6" fill="#7A8899" font-weight="normal">typical team</text>
  <text x="806" y="410" font-size="12.2" fill="#0F2740" font-weight="normal">task-dependent (2.36 mean agents)</text>
  <rect x="790" y="512" width="340" height="86" rx="8" fill="#EFF7F1" stroke="#B9DCC5" stroke-width="1.1"/>
  <text x="806" y="536" font-size="12.5" fill="#1E7A46" font-weight="bold">graceful impossibility reporting</text>
  <text x="806" y="556" font-size="11.8" fill="#0F2740" font-weight="normal">fails closed when required capability is absent,</text>
  <text x="806" y="573" font-size="11.8" fill="#0F2740" font-weight="normal">rather than reporting a false success</text>
  <rect x="28" y="618" width="1124" height="52" rx="10" fill="#F4F8FC" stroke="#D6E3F0" stroke-width="1"/>
  <text x="50" y="648" font-size="12.2" fill="#0F2740" font-weight="normal">Only the task-aware strategy combines zero source edits with selective teams and explicit declines when requirements cannot be met.</text>
</svg>
